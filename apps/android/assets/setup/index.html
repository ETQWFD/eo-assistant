<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>连接 EO助手</title>
  <style>
    :root { --accent:#0f766e; --text:#15211f; --muted:#6b7c78; --line:#dce5e2; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body { background:#f3f6f5; color:var(--text); font:15px/1.5 -apple-system,"Noto Sans SC",sans-serif; display:flex; flex-direction:column; }
    header { padding:calc(18px + env(safe-area-inset-top)) 20px 10px; text-align:center; }
    h1 { margin:0; font-size:30px; color:var(--accent); letter-spacing:1px; }
    header p { margin:8px 0 0; color:var(--muted); font-size:13px; }
    .stage { flex:1; min-height:0; margin:14px 16px; position:relative; background:#0b1513; border-radius:18px; overflow:hidden; }
    video { width:100%; height:100%; object-fit:cover; }
    .scanbox { position:absolute; inset:13% 13% 13% 13%; border:2px solid rgba(255,255,255,.82); border-radius:16px; pointer-events:none; }
    .scanline { position:absolute; left:14%; right:14%; height:2px; background:#5eead4; box-shadow:0 0 16px #2dd4bf; animation:scan 2.2s ease-in-out infinite; }
    @keyframes scan { 0%,100%{top:15%} 50%{top:84%} }
    .status { padding:0 20px 10px; color:var(--muted); font-size:13px; text-align:center; min-height:38px; }
    .status.bad { color:#b42318; }
    .tips { padding:0 22px calc(18px + env(safe-area-inset-bottom)); color:#7d8d89; font-size:12px; line-height:1.65; text-align:center; }
    .badge { display:inline-block; color:var(--accent); background:#e3f2ef; border-radius:999px; padding:3px 9px; font-size:11px; margin-bottom:6px; }
  </style>
</head>
<body>
  <header>
    <div class="badge">无需输入地址</div>
    <h1>连接 EO助手</h1>
    <p>扫描电脑 DSH「EO助手连接」里的二维码</p>
  </header>
  <div class="stage">
    <video id="video" playsinline muted></video>
    <div class="scanbox"></div>
    <div class="scanline"></div>
  </div>
  <div id="status" class="status">正在启动相机…</div>
  <div class="tips">手机和电脑在同一 Wi-Fi 即可。扫码后会自动登记设备、建立端到端加密会话；不保存明文。</div>
  <script src="jsQR.js"></script>
  <script src="scanner.js"></script>
</body>
</html>
