services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATA_FILE: /data/eo.sqlite
      # TRUST_PROXY: "1"   # 仅在 Caddy/Nginx 同机反代时开启
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - eo-data:/data
    user: node

volumes:
  eo-data:
